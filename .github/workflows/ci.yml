name: CI

on:
  push:
    branches: [ main, develop, v2-development ]
  pull_request:
    branches: [ main, develop, v2-development ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ['1.26.x', 'stable']

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Run go vet
      run: go vet './...'

    - name: Run go fmt
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "Code is not formatted. Please run 'go fmt ./...'"
          gofmt -s -l .
          exit 1
        fi
      shell: bash
      if: runner.os != 'Windows'

    - name: Run go fmt (Windows)
      run: |
        $output = gofmt -s -l .
        if ($output) {
          Write-Host "Code is not formatted. Please run 'go fmt ./...'"
          Write-Host $output
          exit 1
        }
      shell: powershell
      if: runner.os == 'Windows'

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out -covermode=atomic './...'
      shell: bash

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.out
        flags: ${{ runner.os }}
        name: codecov-${{ matrix.os }}-${{ matrix.go-version }}
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.26.x'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Build for multiple platforms
      run: |
        mkdir -p dist
        GOOS=windows GOARCH=amd64 go build -trimpath -o dist/plexlinker-v2-windows-amd64.exe ./cmd/plexlinker-v2
        GOOS=linux GOARCH=amd64 go build -trimpath -o dist/plexlinker-v2-linux-amd64 ./cmd/plexlinker-v2
        GOOS=linux GOARCH=arm64 go build -trimpath -o dist/plexlinker-v2-linux-arm64 ./cmd/plexlinker-v2
        GOOS=darwin GOARCH=amd64 go build -trimpath -o dist/plexlinker-v2-darwin-amd64 ./cmd/plexlinker-v2
        GOOS=darwin GOARCH=arm64 go build -trimpath -o dist/plexlinker-v2-darwin-arm64 ./cmd/plexlinker-v2
        GOOS=windows GOARCH=amd64 go build -trimpath -o dist/plexlinker-v1-legacy-windows-amd64.exe ./cmd/plexlinker

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: binaries
        path: dist/*

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
        args: --timeout=5m
