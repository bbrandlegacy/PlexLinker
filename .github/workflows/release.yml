name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify release source
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Require an exact semantic version tag on main
      shell: bash
      run: |
        if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Release tag must be an exact semantic version such as v2.0.0." >&2
          exit 1
        fi
        git fetch --no-tags origin main
        if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
          echo "Refusing to release: ${GITHUB_SHA} is not contained in main." >&2
          exit 1
        fi

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true

    - name: Test release source
      run: |
        go vet ./...
        go test -race ./...

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: preflight
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Get version
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Build binaries
      run: |
        mkdir -p dist
        VERSION="${GITHUB_REF#refs/tags/}"
        LDFLAGS="-s -w -X plexlinker/internal/buildinfo.Version=${VERSION}"
        GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/plexlinker-windows-amd64.exe ./cmd/plexlinker-v2
        GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/plexlinker-linux-amd64 ./cmd/plexlinker-v2
        GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/plexlinker-linux-arm64 ./cmd/plexlinker-v2
        GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/plexlinker-darwin-amd64 ./cmd/plexlinker-v2
        GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dist/plexlinker-darwin-arm64 ./cmd/plexlinker-v2
        GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/plexlinker-v1-legacy-windows-amd64.exe ./cmd/plexlinker

    - name: Create checksums
      run: |
        cd dist
        sha256sum * > checksums.txt

    - name: Smoke-test version metadata
      run: |
        chmod +x dist/plexlinker-linux-amd64
        EXPECTED="PlexLinker v2 ${GITHUB_REF_NAME}"
        ACTUAL="$(dist/plexlinker-linux-amd64 --version)"
        if [ "${ACTUAL}" != "${EXPECTED}" ]; then
          echo "Version mismatch: expected '${EXPECTED}', got '${ACTUAL}'" >&2
          exit 1
        fi

    - name: Generate changelog
      id: changelog
      run: |
        # Extract changelog for this version from CHANGELOG.md
        if [ -f CHANGELOG.md ]; then
          # Get content between this version and previous version/unreleased
          sed -n "/## \[${GITHUB_REF#refs/tags/v}\]/,/## \[/p" CHANGELOG.md | sed '$d' > release_notes.md
        else
          echo "See CHANGELOG.md for details" > release_notes.md
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/plexlinker-windows-amd64.exe
          dist/plexlinker-linux-amd64
          dist/plexlinker-linux-arm64
          dist/plexlinker-darwin-amd64
          dist/plexlinker-darwin-arm64
          dist/plexlinker-v1-legacy-windows-amd64.exe
          dist/checksums.txt
        body_path: release_notes.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: release-binaries
        path: dist/*
